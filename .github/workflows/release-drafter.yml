name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  draft:
    # TEMPLATE: after creating a repo from this template, set this to that repo's
    # "owner/name" so release-drafter doesn't run on forks of it.
    if: github.repository == 'Andx667/MOD_REPO'
    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Draft Release
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
